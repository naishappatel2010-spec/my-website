
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Monthly Pass - Demo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Fira Sans", sans-serif;
            background-color: #36559E;
            color: #222;
        }

        .header {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .header img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: cover;
        }

        .container {
            width: 90%;
            max-width: 420px;
            margin: 24px auto;
            padding: 24px 20px;
            background-color: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .demo-label {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            border: 1px solid #b7791f;
            border-radius: 5px;
            background: #fff7df;
            color: #754c00;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .title {
            margin: 8px 0 18px;
            font-size: 25px;
            font-weight: 700;
            color: #263b67;
        }

        .date-time {
            margin: 8px 0;
            font-size: 16px;
            color: #333;
        }

        .transit-name {
            margin-top: 20px;
            font-size: 21px;
            font-weight: 700;
            color: #263b67;
        }

        .bus-image {
            display: block;
            width: 100%;
            max-width: 240px;
            max-height: 130px;
            object-fit: contain;
            margin: 18px auto;
        }

        .demo-notice {
            margin: 16px 0;
            padding: 10px;
            border-radius: 8px;
            background: #f1f4fa;
            color: #344563;
            font-size: 13px;
            line-height: 1.5;
        }

        .timer-heading {
            margin-top: 18px;
            font-weight: 600;
        }

        #timer {
            margin: 8px 0;
            font-size: 25px;
            font-weight: 700;
            color: #263b67;
            font-variant-numeric: tabular-nums;
        }

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            background-color: #36559E;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background-color: #263f79;
        }

        .footer {
            width: 100%;
            margin-top: 30px;
            overflow: hidden;
        }

        .footer img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 160px;
            object-fit: cover;
        }

        @media (max-width: 480px) {
            .container {
                width: 92%;
                padding: 20px 16px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <img
            src="https://hotspot-new.netlify.app/header.jpg"
            alt="Page header"
        >
    </header>

    <main class="container">
        <span class="demo-label">DEMO — NOT VALID FOR TRAVEL</span>

        <h1 class="title">Student Monthly Pass</h1>

        <p class="date-time" id="date">Date: Loading...</p>
        <p class="date-time" id="time">Time: Loading...</p>

        <div class="transit-name">Transit Pass Preview</div>

        <img
            class="bus-image"
            src="https://hotspot-new.netlify.app/my.gif"
            alt="Animated bus graphic"
        >

        <div class="demo-notice">
            This is a design preview only. It is not an official transit
            ticket or proof of fare payment.
        </div>

        <p class="timer-heading">Demo countdown</p>
        <div id="timer">02:00</div>

        <button class="button" id="resetButton" type="button">
            Reset Demo Timer
        </button>
    </main>

    <footer class="footer">
        <img
            src="https://hotspot-new.netlify.app/footer.jpg"
            alt="Page footer"
        >
    </footer>

    <script>
        function updateDateTime() {
            const now = new Date();

            document.getElementById("date").textContent =
                "Date: " + now.toLocaleDateString();

            document.getElementById("time").textContent =
                "Time: " + now.toLocaleTimeString();
        }

        let remainingSeconds = 120;
        let timerInterval;

        function displayTimer() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;

            document.getElementById("timer").textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        function startDemoTimer() {
            clearInterval(timerInterval);
            remainingSeconds = 120;
            displayTimer();

            timerInterval = setInterval(function () {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    displayTimer();
                } else {
                    clearInterval(timerInterval);
                    document.getElementById("timer").textContent =
                        "DEMO ENDED";
                }
            }, 1000);
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

        document.getElementById("resetButton").addEventListener(
            "click",
            startDemoTimer
        );

        startDemoTimer();
    </script>

</body>
</html>
