
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrie Transit - Student Monthly Pass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            background-color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Top Navigation Header */
        .nav-header {
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 24px;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            width: 24px;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
        }

        .back-arrow {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .back-arrow svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        /* Main Ticket Area */
        .ticket-content {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-card {
            background-color: #2b3d85; /* Updated Theme Color */
            width: 100%;
            border-radius: 12px;
            padding: 24px 16px;
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .pass-type {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }

        .date-display {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .time-display {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .agency-name {
            font-size: 1.25rem;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        /* Vector Cityscape graphic placeholder */
        .cityscape-container {
            width: 100%;
            background: linear-gradient(to bottom, #dbe9f6 0%, #b3d1eb 60%, #e2ebf4 100%);
            height: 180px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cityscape-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .expire-pill {
            background-color: #e53935;
            color: white;
            padding: 8px 32px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: absolute;
            bottom: -18px;
            z-index: 10;
        }

        /* Countdown & User ID section */
        .meta-container {
            background-color: #2b3d85; /* Updated Theme Color */
            width: 100%;
            margin-top: 36px;
            padding: 16px;
            color: white;
            text-align: center;
            border-radius: 4px;
        }

        .minutes-label {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .user-id {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .live-map-button {
            background-color: #e53935;
            color: white;
            padding: 12px 48px;
            border-radius: 24px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-top: 24px;
            cursor: pointer;
        }

        /* Bottom Tab Navigation bar */
        .bottom-nav {
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            background-color: #ffffff;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #757575;
            font-size: 0.75rem;
            cursor: pointer;
            width: 25%;
        }

        .nav-item.active {
            color: #00acc1;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Top Navigation Header -->
    <header class="nav-header">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="back-arrow">
            <svg viewBox="0 0 24 24">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
        </div>
    </header>

    <!-- Main Ticket Content -->
    <main class="ticket-content">
        <div class="main-card">
            <div class="pass-type">Student Monthly Pass</div>
            <div class="date-display" id="current-date">Wed Oct 28 2026</div>
            <div class="time-display" id="current-time">10:36:38 PM</div>
            <div class="agency-name">Barrie Transit</div>
            
            <!-- Graphic Element Mockup Box -->
            <div class="cityscape-container">
                <svg class="cityscape-svg" viewBox="0 0 400 180" xmlns="http://w3.org">
                    <rect x="20" y="90" width="20" height="60" fill="#0d47a1" opacity="0.8"/>
                    <rect x="35" y="110" width="15" height="40" fill="#1565c0" />
                    <rect x="55" y="100" width="25" height="50" fill="#0d47a1" />
                    <rect x="100" y="115" width="45" height="35" fill="#1e88e5" />
                    <rect x="150" y="105" width="30" height="45" fill="#1565c0" />
                    <rect x="210" y="115" width="20" height="35" fill="#0d47a1" />
                    <rect x="250" y="110" width="30" height="40" fill="#1e88e5" />
                    <rect x="290" y="70" width="25" height="80" fill="#1565c0" opacity="0.7"/>
                    <rect x="320" y="85" width="35" height="65" fill="#0d47a1" />
                    <!-- Windows -->
                    <rect x="325" y="95" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <rect x="335" y="95" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <rect x="345" y="95" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <rect x="325" y="105" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <rect x="335" y="105" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <rect x="345" y="105" width="5" height="5" fill="#fff" opacity="0.6"/>
                    <!-- Ground -->
                    <rect x="0" y="145" width="400" height="35" fill="#757575" />
                </svg>
            </div>

            <button class="expire-pill">Expire</button>
        </div>

        <!-- Expiration countdown indicator & ID -->
        <div class="meta-container">
            <div class="minutes-label">minutes</div>
            <div class="user-id">User ID 100484912</div>
        </div>

        <button class="live-map-button">Live Map</button>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-6 10h-2v2H9v-2H7v-2h2V9h2v2h2v2z"/></svg>
            <span>Parking</span>
        </div>
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 2c-4.42 0-8 3.58-8 8v7c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-3h6v3c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-3h1c.55 0 1-.45 1-1v-7c0-4.42-3.58-8-8-8zm-4 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm8 8H8v-3h8v3zm0-6c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>
            <span>Transit</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>Permits</span>
        </div>
    </nav>
</div>

<script>
    function updateClock() {
        const now = new Date();
        
        // Target date formatting matching the image format
        const optionsDate = { weekday: 'short', month: 'short', day: '2-digit', year: 'numeric' };
        let formattedDate = now.toLocaleDateString('en-US', optionsDate).replace(/,/g, '');
        document.getElementById('current-date').textContent = formattedDate;

        // Target time formatting matching the image format
let formattedTime = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
document.getElementById('current-time').textContent = formattedTime;
}
setInterval(updateClock, 1000);
updateClock(); // Initial calculation
